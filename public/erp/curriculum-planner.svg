<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="t">
<title id="t">Curriculum Planner — Lo-fi placeholder</title>
<rect width="400" height="260" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
<rect x="12" y="12" width="376" height="32" rx="8" fill="white" stroke="#E2E8F0"/>
<rect x="20" y="20" width="110" height="10" rx="4" fill="#1E293B"/>
<rect x="20" y="34" width="160" height="6" rx="3" fill="#94A3B8"/>
<circle cx="368" cy="28" r="10" fill="#FFAB00"/>
<!-- timetable grid -->
<rect x="12" y="56" width="376" height="172" rx="12" fill="white" stroke="#E2E8F0"/>
<!-- week header -->
<g font-family="Inter,sans-serif" font-size="7" font-weight="700" letter-spacing="0.05em" fill="#64748B">
<text x="70" y="74">MON</text><text x="130" y="74">TUE</text><text x="190" y="74">WED</text><text x="250" y="74">THU</text><text x="310" y="74">FRI</text>
</g>
<line x1="12" y1="82" x2="388" y2="82" stroke="#F1F5F9" stroke-width="1"/>
<!-- time column -->
<g font-family="Inter,sans-serif" font-size="7" fill="#94A3B8">
<text x="20" y="102">09:00</text><text x="20" y="132">11:00</text><text x="20" y="162">13:00</text><text x="20" y="192">15:00</text>
</g>
<!-- blocks -->
<rect x="60" y="90" width="52" height="28" rx="6" fill="#BFDBFE" stroke="#93C5FD"/><text x="86" y="108" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#1E3A82">Maths</text>
<rect x="120" y="90" width="52" height="28" rx="6" fill="#FDE68A" stroke="#FFAB00"/><text x="146" y="108" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#92400E">Physics</text>
<rect x="180" y="120" width="52" height="28" rx="6" fill="#DCFCE7" stroke="#86EFAC"/><text x="206" y="138" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#166534">Bio</text>
<rect x="240" y="150" width="52" height="28" rx="6" fill="#E9D5FF" stroke="#C4B5FD"/><text x="266" y="168" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#5B21B6">Chem</text>
<rect x="300" y="90" width="52" height="58" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-dasharray="4 3"/><text x="326" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#64748B">Free</text>
<text x="200" y="246" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="700" letter-spacing="0.06em" fill="#64748B">CURRICULUM PLANNER • 400×260</text>
</svg>
