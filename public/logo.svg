<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none">
  <defs>
    <!-- Premium 2.5D Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <!-- Gold Highlight Gradient for Tassel & Bookmark -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC34D"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
  </defs>

  <g id="symbol" filter="url(#dropShadow)">
    
    <!-- THE BOOK: Refined with realistic page layers and depth -->
    <!-- Thick Back Cover (Deep Slate) -->
    <path d="M 16 74 C 32 74 48 82 56 89 C 64 82 80 74 96 74 V 92 C 80 92 64 100 56 107 C 48 100 32 92 16 92 Z" fill="#0F172A"/>
    <!-- Stacked Bottom Pages -->
    <path d="M 18 71 C 32 71 48 79 56 86 V 104 C 48 97 32 89 18 89 Z" fill="#E2E8F0"/>
    <path d="M 94 71 C 80 71 64 79 56 86 V 104 C 64 97 80 89 94 89 Z" fill="#CBD5E1"/>
    <!-- Top Active Pages (Crisp White) -->
    <path d="M 20 68 C 34 68 48 76 56 83 V 101 C 48 94 34 86 20 86 Z" fill="#FFFFFF"/>
    <path d="M 92 68 C 78 68 64 76 56 83 V 101 C 64 94 78 86 92 86 Z" fill="#F8FAFC"/>
    <!-- Center Book Binding/Shadow -->
    <path d="M 56 83 V 107" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Premium Yellow Bookmark -->
    <path d="M 68 73 V 98 L 64 93 L 60 98 V 77 Z" fill="url(#goldGradient)"/>

    <!-- THE GRADUATION CAP: Dimensional thickness and sweeping tassel -->
    <!-- Cap Skullcap (Base) -->
    <path d="M 40 43 V 56 C 40 65 72 65 72 56 V 43 Z" fill="#0F172A"/>
    <!-- Mortarboard Bottom Edge / Thickness -->
    <path d="M 56 19 L 18 36 L 56 53 L 94 36 Z" fill="#1E293B"/>
    <!-- Mortarboard Top Surface -->
    <path d="M 56 15 L 18 32 L 56 49 L 94 32 Z" fill="#334155"/>
    <!-- Center Gold Button -->
    <circle cx="56" cy="32" r="4" fill="url(#goldGradient)"/>
    <!-- Swaying Tassel -->
    <path d="M 56 32 Q 84 40 84 62" stroke="url(#goldGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Thick Tassel Fringe -->
    <path d="M 80 62 L 88 62 L 86 74 L 84 72 L 82 74 Z" fill="url(#goldGradient)"/>
    
  </g>
  
  <!-- Wordmark: Inter, Tight Kerning -->
  <text x="114" y="74" font-family="Inter, sans-serif" font-size="42" font-weight="600" fill="#1E293B" letter-spacing="-1.5">FeeCollect<tspan font-weight="400" fill="#737373">.io</tspan></text>
</svg>
